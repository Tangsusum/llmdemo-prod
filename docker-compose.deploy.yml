# Deploy override for the hosted demo.
#
# Usage (always layered on top of the backend compose file):
#   docker compose -f docker-compose-backend.yml -f docker-compose.deploy.yml up -d
#
# Pins the deployed Datadog identity to env `production` so telemetry never
# merges with the Singapore hawker fleet (`sg-hawker-showdown` / `sg-production`),
# joins RUM and APM via datadog + W3C trace propagation with 128-bit trace IDs,
# enables AI Guard blocking, and probes /game for health.
# Prompt Management publishes the coffee prompt to Feature Flags env `production`.
services:
  app:
    container_name: llm-app
    environment:
      - DD_SERVICE=melbourne-coffee-guardrail
      - DD_ENV=production
      - DD_VERSION=1.0.0
      - DD_LLMOBS_ML_APP=melbourne-coffee-guardrail
      - DD_TRACE_AGENT_PORT=8126
      - DD_TRACE_PROPAGATION_STYLE=datadog,tracecontext
      - DD_TRACE_128_BIT_TRACEID_GENERATION_ENABLED=true
      - DD_AI_GUARD_BLOCK=${DD_AI_GUARD_BLOCK:-true}

    # /menu now 302-redirects to /game, so probe /game directly.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/game"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  datadog:
    container_name: datadog
    environment:
      - DD_ENV=production
      - DD_APM_ENABLED=true
      - DD_APM_NON_LOCAL_TRAFFIC=true

networks:
  default:
    name: llm-network
