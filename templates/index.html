<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>apidays Australia 2026</title>
  <link rel="stylesheet" href="/static/style.css">

  <script>
    (function(h,o,u,n,d) {
       h=h[d]=h[d]||{q:[],onReady:function(c){h.q.push(c)}}
       d=o.createElement(u);d.async=1;d.src=n
       n=o.getElementsByTagName(u)[0];n.parentNode.insertBefore(d,n)
    })(window,document,'script','https://www.datadoghq-browser-agent.com/us1/v5/datadog-rum.js','DD_RUM')

    window.isDatadogSynthetics = function () {
      try {
        if (window._DATADOG_SYNTHETICS) return true;
        if (navigator.userAgent && /DatadogSynthetics/i.test(navigator.userAgent)) return true;
      } catch (e) {}
      return false;
    };

    window.DD_RUM.onReady(function() {
      window.DD_RUM.init({
        applicationId: 'c6d36c51-6689-4e5f-9373-21dcaedac6db',
        clientToken: 'pubc9756272a40a7b07b135ebb1143caae6',
        site: 'datadoghq.com',
        service: '{{ dd_service }}',
        env: '{{ dd_env }}',
        version: '{{ dd_version }}',
        sessionSampleRate: 100,
        sessionReplaySampleRate: 100,
        trackUserInteractions: true,
        trackResources: true,
        trackLongTasks: true,
        defaultPrivacyLevel: 'mask-user-input',
        allowedTracingUrls: [
          {
            match: function (url) {
              if (!url) return false;
              if (url.startsWith(window.location.origin)) return true;
              return /https?:\/\/(localhost|127\.0\.0\.1)(:\d+)?(?:\/|$)/.test(url) ||
                /https:\/\/(?:[a-z0-9-]+\.)?dd-demo-sg-llm\.com(?:\/|$)/.test(url);
            },
            propagatorTypes: ["datadog", "tracecontext"]
          }
        ],
        traceSampleRate: 100
      });
      window.DD_RUM.startSessionReplayRecording({ force: true });

      function setRUMUserContext() {
        const userName = sessionStorage.getItem("user_name") || localStorage.getItem('shopAssistUser') || 'anonymous';
        window.DD_RUM.setUser({
          id: userName,
          name: userName,
          page: 'welcome',
          session_type: 'demo',
          entry_point: 'index',
          traffic: window.isDatadogSynthetics() ? 'synthetics' : 'user'
        });
      }

      setRUMUserContext();
      window.addEventListener('storage', setRUMUserContext);

      try {
        window.DD_RUM.addAction('demo_entered', {
          page: 'welcome',
          entry_point: 'index'
        });
      } catch (rumError) {
        console.warn("RUM tracking error (non-critical):", rumError);
      }
    });
  </script>
</head>
<body>
  <div class="landing">
    <div class="landing-hero">
      <div class="landing-card">
        <img
          class="landing-logo"
          src="/static/logo_img/melbourne-coffee.png"
          alt="apidays Australia 2026"
          width="512"
          height="512"
        >
        <h1 class="landing-title">apidays Australia 2026</h1>
        <p class="landing-subtitle">
          One Melbourne coffee, one guardrail, and your whole session journey in Datadog.
        </p>

        <form class="landing-form" id="landingForm" action="/game" method="get">
          <label for="username">What's your name and company?</label>
          <input
            id="username"
            class="name-input"
            type="text"
            name="username"
            maxlength="50"
            autocomplete="name"
            placeholder="e.g. alex_datadog"
          >
          <button type="submit" class="primary landing-start" data-dd-action-name="demo_start_journey">
            Start your journey
          </button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const usernameInput = document.getElementById("username");
    const startButton = document.querySelector(".landing-start");
    const landingForm = document.getElementById("landingForm");
    const namePlaceholder = "e.g. alex_datadog";
    const nameRequired = "Please enter your name first!";

    landingForm.addEventListener("submit", function (e) {
      e.preventDefault();
      const name = usernameInput.value.trim();
      if (!name) {
        usernameInput.style.borderColor = "var(--error)";
        usernameInput.style.boxShadow = "0 0 0 3px rgba(201, 76, 50, 0.15)";
        usernameInput.placeholder = nameRequired;
        usernameInput.focus();
        setTimeout(function () {
          usernameInput.style.borderColor = "";
          usernameInput.style.boxShadow = "";
          usernameInput.placeholder = namePlaceholder;
        }, 3000);
        return;
      }

      startButton.disabled = true;
      startButton.textContent = "Starting...";
      sessionStorage.setItem("user_name", name);
      try {
        if (window.DD_RUM) {
          window.DD_RUM.setUser({
            id: name,
            name: name,
            page: "welcome",
            session_type: "demo",
            entry_point: "index",
            traffic: window.isDatadogSynthetics() ? "synthetics" : "user"
          });
          window.DD_RUM.addAction("demo_start_journey", {
            user_name: name,
            page: "welcome"
          });
        }
      } catch (rumError) {
        console.warn("RUM tracking error (non-critical):", rumError);
      }
      window.location.href = "/game";
    });

    usernameInput.focus();
  </script>
</body>
</html>
