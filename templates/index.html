<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Datadog Live Vietnam</title>
  <link rel="stylesheet" href="/static/style.css">

  <script>
    (function(h,o,u,n,d) {
       h=h[d]=h[d]||{q:[],onReady:function(c){h.q.push(c)}}
       d=o.createElement(u);d.async=1;d.src=n
       n=o.getElementsByTagName(u)[0];n.parentNode.insertBefore(d,n)
    })(window,document,'script','https://www.datadoghq-browser-agent.com/us1/v5/datadog-rum.js','DD_RUM')

    window.isDatadogSynthetics = function () {
      try {
        if (window._DATADOG_SYNTHETICS) return true;
        if (navigator.userAgent && /DatadogSynthetics/i.test(navigator.userAgent)) return true;
      } catch (e) {}
      return false;
    };

    window.DD_RUM.onReady(function() {
      window.DD_RUM.init({
        applicationId: '95ad2a6f-23d2-4f1b-8e44-46f0570d49a4',
        clientToken: 'pub65c3cc3be5c573795f0bfffdc7cc3857',
        site: 'datadoghq.com',
        service: 'hanoi-coffee-guardrail',
        env: 'production',
        version: '1.0.0',
        sessionSampleRate: 100,
        sessionReplaySampleRate: 100,
        trackUserInteractions: true,
        trackResources: true,
        trackLongTasks: true,
        defaultPrivacyLevel: 'mask-user-input',
        allowedTracingUrls: [
          {
            match: function (url) {
              return url.startsWith(window.location.origin) ||
                url.startsWith("https://prod.dd-demo-sg-llm.com") ||
                url.startsWith("https://dd-demo-sg-llm.com");
            },
            propagatorTypes: ["datadog", "tracecontext"]
          }
        ],
        traceSampleRate: 100
      });
      window.DD_RUM.startSessionReplayRecording({ force: true });

      function setRUMUserContext() {
        const userName = sessionStorage.getItem("user_name") || localStorage.getItem('shopAssistUser') || 'anonymous';
        window.DD_RUM.setUser({
          id: userName,
          name: userName,
          page: 'welcome',
          session_type: 'demo',
          entry_point: 'index',
          traffic: window.isDatadogSynthetics() ? 'synthetics' : 'user'
        });
      }

      setRUMUserContext();
      window.addEventListener('storage', setRUMUserContext);

      try {
        window.DD_RUM.addAction('demo_entered', {
          page: 'welcome',
          entry_point: 'index'
        });
      } catch (rumError) {
        console.warn("RUM tracking error (non-critical):", rumError);
      }
    });
  </script>
</head>
<body>
  <div class="landing">
    <div class="landing-topbar">
      <div class="lang-toggle" role="group" aria-label="Language">
        <button type="button" class="lang-btn is-active" data-lang="vi">VI</button>
        <button type="button" class="lang-btn" data-lang="en">EN</button>
      </div>
    </div>

    <div class="landing-hero">
      <div class="landing-card">
        <img
          class="landing-logo"
          src="/static/logo_img/datadogvn.png"
          alt="Datadog Live Vietnam"
          width="512"
          height="512"
        >
        <h1 class="landing-title" data-i18n="title">Datadog Live Vietnam</h1>
        <p class="landing-subtitle" data-i18n="subtitle">
          Một ly cà phê Hà Nội, một guardrail, và cả hành trình của bạn trên Datadog.
        </p>

        <form class="landing-form" id="landingForm" action="/game" method="get">
          <label for="username" data-i18n="nameLabel">Tên và công ty của bạn?</label>
          <input
            id="username"
            class="name-input"
            type="text"
            name="username"
            maxlength="50"
            autocomplete="name"
            data-i18n-placeholder="namePlaceholder"
            placeholder="vd. bang_datadog"
          >
          <button type="submit" class="primary landing-start" data-dd-action-name="demo_start_journey" data-i18n="cta">
            Bắt đầu hành trình
          </button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const I18N = {
      vi: {
        pageTitle: "Datadog Live Vietnam",
        title: "Datadog Live Vietnam",
        subtitle: "Một ly cà phê Hà Nội, một guardrail, và cả hành trình của bạn trên Datadog.",
        nameLabel: "Tên và công ty của bạn?",
        namePlaceholder: "vd. bang_datadog",
        nameRequired: "Hãy nhập tên trước nhé!",
        cta: "Bắt đầu hành trình",
        starting: "Đang mở..."
      },
      en: {
        pageTitle: "Datadog Live Vietnam",
        title: "Datadog Live Vietnam",
        subtitle: "One Hanoi coffee, one guardrail, and your whole session journey in Datadog.",
        nameLabel: "What's your name and company?",
        namePlaceholder: "e.g. bang_datadog",
        nameRequired: "Please enter your name first!",
        cta: "Start your journey",
        starting: "Starting..."
      }
    };

    const usernameInput = document.getElementById("username");
    const startButton = document.querySelector(".landing-start");
    const landingForm = document.getElementById("landingForm");
    let currentLang = localStorage.getItem("ctf_lang") === "en" ? "en" : "vi";

    function t(key) {
      return (I18N[currentLang] && I18N[currentLang][key]) || I18N.vi[key] || "";
    }

    function applyLanguage() {
      const copy = I18N[currentLang];
      document.documentElement.lang = currentLang;
      document.title = copy.pageTitle;
      document.querySelectorAll(".lang-btn").forEach(function (btn) {
        btn.classList.toggle("is-active", btn.getAttribute("data-lang") === currentLang);
      });
      document.querySelectorAll("[data-i18n]").forEach(function (el) {
        const key = el.getAttribute("data-i18n");
        if (copy[key] != null) el.textContent = copy[key];
      });
      document.querySelectorAll("[data-i18n-placeholder]").forEach(function (el) {
        const key = el.getAttribute("data-i18n-placeholder");
        if (copy[key] != null) el.setAttribute("placeholder", copy[key]);
      });
    }

    function setLanguage(lang) {
      currentLang = lang === "en" ? "en" : "vi";
      localStorage.setItem("ctf_lang", currentLang);
      applyLanguage();
    }

    document.querySelectorAll(".lang-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        setLanguage(btn.getAttribute("data-lang"));
      });
    });

    landingForm.addEventListener("submit", function (e) {
      e.preventDefault();
      const name = usernameInput.value.trim();
      if (!name) {
        usernameInput.style.borderColor = "var(--error)";
        usernameInput.style.boxShadow = "0 0 0 3px rgba(201, 76, 50, 0.15)";
        usernameInput.placeholder = t("nameRequired");
        usernameInput.focus();
        setTimeout(function () {
          usernameInput.style.borderColor = "";
          usernameInput.style.boxShadow = "";
          usernameInput.placeholder = t("namePlaceholder");
        }, 3000);
        return;
      }

      startButton.disabled = true;
      startButton.textContent = t("starting");
      sessionStorage.setItem("user_name", name);
      try {
        if (window.DD_RUM) {
          window.DD_RUM.setUser({
            id: name,
            name: name,
            page: "welcome",
            session_type: "demo",
            entry_point: "index",
            traffic: window.isDatadogSynthetics() ? "synthetics" : "user"
          });
          window.DD_RUM.addAction("demo_start_journey", {
            user_name: name,
            page: "welcome"
          });
        }
      } catch (rumError) {
        console.warn("RUM tracking error (non-critical):", rumError);
      }
      window.location.href = "/game";
    });

    applyLanguage();
    usernameInput.focus();
  </script>
</body>
</html>
