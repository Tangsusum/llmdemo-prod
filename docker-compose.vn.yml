# VN market override for the Vietnam host (vn.dd-demo-sg-llm.com).
#
# Usage (always layered on top of the backend compose file):
#   docker compose -f docker-compose-backend.yml -f docker-compose.vn.yml up -d
#
# Keeps VN telemetry in its own Datadog service so it never merges with the
# Singapore hawker fleet (`sg-hawker-showdown` / `sg-production`).
# Prompt Management publishes the coffee prompt to Feature Flags env `production`.
services:
  app:
    container_name: llm-vn-app
    environment:
      - DD_SERVICE=hanoi-coffee-guardrail-vn
      - DD_ENV=production
      - DD_VERSION=1.0.0
      - DD_LLMOBS_ML_APP=hanoi-coffee-guardrail-vn
      - DD_TRACE_AGENT_PORT=8126
      - DD_TRACE_PROPAGATION_STYLE=datadog,tracecontext
      - DD_TRACE_128_BIT_TRACEID_GENERATION_ENABLED=true
      - DD_AI_GUARD_BLOCK=${DD_AI_GUARD_BLOCK:-true}

    # /menu now 302-redirects to /game, so probe /game directly.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/game"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  datadog:
    container_name: datadog-vn
    environment:
      - DD_ENV=production
      - DD_TAGS=market:vn
      - DD_APM_ENABLED=true
      - DD_APM_NON_LOCAL_TRAFFIC=true

networks:
  default:
    name: llm-vn-network
